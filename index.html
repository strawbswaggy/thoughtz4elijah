<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thoughtz</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: url("https://i.pinimg.com/originals/c8/e1/57/c8e15787a56cba7278146d79c93fd7bc.gif")
          no-repeat center center fixed;
        background-size: cover;
        color: white;
      }

      /* OVERLAY - Keep main blur here only */
      .overlay {
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 40px 20px;
        background: radial-gradient(
          circle at center,
          rgba(255, 0, 0, 0.1),
          rgba(0, 0, 0, 0.88)
        );
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        overflow-y: auto;
      }

      .page {
        display: none;
        width: 100%;
      }
      .active {
        display: flex;
        justify-content: center;
      }

      /* CARD WRAPPER */
      .card {
        width: 100%;
        max-width: 650px;
        text-align: center;
      }

      /* TITLE */
      h1 {
        margin-bottom: 15px;
        text-shadow: 0 0 10px red;
      }

      /* INPUTS & TEXTAREAS - Switched from backdrop-filter to solid dark alpha */
      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(18, 18, 18, 0.85);
        color: white;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input:focus,
      textarea:focus {
        border-color: red;
        background: rgba(25, 25, 25, 0.95);
        box-shadow: 0 0 10px red;
        outline: none;
      }

      /* UPLOAD CONFIG PANEL */
      .upload-panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        background: rgba(10, 10, 10, 0.6);
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: left;
      }

      .upload-panel input[type="file"] {
        margin-top: 0;
        padding: 5px;
        font-size: 12px;
        border: none;
        background: transparent;
      }

      .spoiler-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
      }

      .spoiler-toggle input {
        width: auto;
        margin-top: 0;
        cursor: pointer;
      }

      /* BUTTONS */
      button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(
          45deg,
          rgba(255, 0, 0, 0.8),
          rgba(255, 77, 77, 0.8)
        );
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 12px red;
        background: linear-gradient(45deg, red, #ff4d4d);
      }

      /* MAIN NOTE CONTAINER */
      .note {
        background: rgba(20, 20, 20, 0.85);
        margin-top: 20px;
        padding: 20px;
        border-radius: 12px;
        border-left: 3px solid rgba(255, 0, 0, 0.7);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        text-align: left;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }

      /* COMMENTS */
      .reply {
        background: rgba(35, 35, 35, 0.6);
        margin-top: 15px;
        padding: 15px;
        border-radius: 10px;
        border-left: 2px solid rgba(255, 255, 255, 0.25);
        display: flex;
        flex-direction: column;
      }

      /* SUB-REPLIES TO COMMENTS */
      .sub-reply-container {
        background: rgba(45, 45, 45, 0.4);
        margin-top: 10px;
        margin-left: 20px;
        padding: 10px;
        border-radius: 8px;
        border-left: 2px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
      }

      /* WRITER SPECIFIC FEEDBACK TRACK */
      .writer-response {
        background: rgba(60, 0, 0, 0.3);
        margin-top: 10px;
        margin-left: 20px;
        padding: 10px;
        border-radius: 8px;
        border-left: 2px solid rgba(255, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
      }

      .reply button,
      .sub-reply-container button,
      .writer-response button,
      .note button {
        width: auto;
        padding: 5px 12px;
        margin-top: 8px;
        margin-right: 5px;
        font-size: 12px;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
      }

      /* TIMESTAMPS */
      .time-container {
        display: flex;
        justify-content: flex-end;
        width: 100%;
        margin-top: 6px;
      }

      .time {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.3px;
      }

      /* MULTI IMAGE GRID */
      .images-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        width: 100%;
      }

      .attached-image-container {
        max-width: calc(50% - 4px);
        min-width: 100px;
        flex-grow: 1;
        position: relative;
        border-radius: 6px;
        overflow: hidden;
      }

      .attached-image {
        display: block;
        width: 100%;
        max-height: 160px;
        object-fit: cover;
        border-radius: 6px;
      }

      /* PHOTO SPOILER */
      .image-spoiler-blur {
        position: relative;
        cursor: pointer;
      }

      .image-spoiler-blur::before {
        content: "SPOILER";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
        transition: opacity 0.2s ease;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .image-spoiler-blur.revealed::before {
        opacity: 0;
        pointer-events: none;
      }

      /* TEXT SPOILER CSS */
      .spoiler {
        background-color: rgba(255, 255, 255, 0.18);
        color: transparent;
        border-radius: 3px;
        padding: 0 4px;
        cursor: pointer;
        transition: background-color 0.1s ease, color 0.1s ease;
        user-select: none;
      }

      .spoiler.revealed {
        background-color: rgba(255, 255, 255, 0.08);
        color: inherit;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <div class="overlay">
      <div id="passwordPage" class="page active">
        <div class="card" style="margin-top: 15vh">
          <h1>🕷 thoughtz</h1>
          <input
            id="pass"
            type="password"
            placeholder="Enter password (hint bday!)"
            onkeydown="if(event.key==='Enter') login()"
          />
          <button onclick="login()">ENTER</button>
        </div>
      </div>

      <div id="modePage" class="page">
        <div class="card" style="margin-top: 15vh">
          <h1>Mode</h1>
          <button onclick="mode('writer')">Writer</button>
          <button onclick="mode('viewer')">Viewer</button>
        </div>
      </div>

      <div id="writerPage" class="page">
        <div class="card">
          <h1>Writer Dashboard</h1>
          <textarea
            id="noteInput"
            placeholder="What's on your mind? (||spoiler||)"
            rows="3"
            onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); addNote(); }"
          ></textarea>

          <div class="upload-panel">
            <input type="file" id="noteFiles" accept="image/*" multiple />
            <label class="spoiler-toggle">
              <input type="checkbox" id="noteFilesSpoiler" />
              Spoiler All Photos?
            </label>
          </div>

          <button onclick="addNote()">Post Note</button>
          <button onclick="back()">Back</button>
          <div id="writerNotes"></div>
        </div>
      </div>

      <div id="viewerPage" class="page">
        <div class="card">
          <h1>Viewer Feed</h1>
          <button onclick="back()">Back</button>
          <div id="viewerNotes"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        onSnapshot,
        updateDoc,
        deleteDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDTlahuS9_JdyMuBA4_vGpRaYK7l04xc1Y",
        authDomain: "thoughtz-36311.firebaseapp.com",
        projectId: "thoughtz-36311",
        storageBucket: "thoughtz-36311.firebasestorage.app",
        messagingSenderId: "987082044864",
        appId: "1:987082044864:web:1cc521d2cfc894c6eac425",
        measurementId: "G-J9M5GWLVX0",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const notesRef = collection(db, "notes");

      const PASS = "0420";
      let notes = [];

      /* IMAGE COMPRESSION HELPER */
      function compressImage(file, maxWidth = 800, quality = 0.7) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement("canvas");
              let width = img.width;
              let height = img.height;

              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              resolve(canvas.toDataURL("image/jpeg", quality));
            };
          };
        });
      }

      /* HELPER PARSERS */
      function parseSpoilers(text) {
        if (!text) return "";
        let formatted = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>");
        return formatted.replace(
          /\|\|(.*?)\|\|/g,
          '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>'
        );
      }

      function renderImagesMarkup(imagesArray) {
        if (!imagesArray || imagesArray.length === 0) return "";
        let imagesHTML = imagesArray
          .map((img) => {
            const classes = img.spoiler
              ? "attached-image-container image-spoiler-blur"
              : "attached-image-container";
            return `
            <div class="${classes}" onclick="this.classList.add('revealed')">
              <img src="${img.data}" class="attached-image" alt="Uploaded asset" loading="lazy" />
            </div>
          `;
          })
          .join("");
        return `<div class="images-grid">${imagesHTML}</div>`;
      }

      async function processMultipleFiles(fileInput, checkSpoiler) {
        if (!fileInput || !fileInput.files || fileInput.files.length === 0)
          return [];
        let files = Array.from(fileInput.files);
        let loadedImages = [];

        for (let file of files) {
          const compressedData = await compressImage(file);
          loadedImages.push({ data: compressedData, spoiler: checkSpoiler });
        }
        return loadedImages;
      }

      function getFormattedDate() {
        const now = new Date();
        const options = { year: "numeric", month: "short", day: "2-digit" };
        const datePart = now.toLocaleDateString("en-US", options);
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        const ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12 || 12;
        return `${datePart} • ${hours}:${minutes}:${seconds} ${ampm}`;
      }

      /* UI NAVIGATION */
      window.show = (p) => {
        document
          .querySelectorAll(".page")
          .forEach((x) => x.classList.remove("active"));
        document.getElementById(p).classList.add("active");
      };

      window.login = () => {
        if (document.getElementById("pass").value === PASS) show("modePage");
        else alert("Wrong password");
      };

      window.mode = (m) => show(m === "writer" ? "writerPage" : "viewerPage");
      window.back = () => show("modePage");

      /* DB REALTIME LISTENER */
      onSnapshot(notesRef, (snap) => {
        notes = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        loadWriter();
        loadViewer();
      });

      /* ADD MAIN POST */
      window.addNote = async () => {
        let text = document.getElementById("noteInput").value.trim();
        let fileInput = document.getElementById("noteFiles");
        let isSpoiler = document.getElementById("noteFilesSpoiler").checked;

        if (!text && fileInput.files.length === 0) return;
        let imagesData = await processMultipleFiles(fileInput, isSpoiler);

        await addDoc(notesRef, {
          text,
          images: imagesData,
          time: getFormattedDate(),
          timestamp: Date.now(),
          replies: [],
        });

        document.getElementById("noteInput").value = "";
        fileInput.value = "";
        document.getElementById("noteFilesSpoiler").checked = false;
      };

      window.deleteNote = async (id) => await deleteDoc(doc(db, "notes", id));
      window.editNote = async (id, old) => {
        let t = prompt("Edit text:", old);
        if (t) await updateDoc(doc(db, "notes", id), { text: t });
      };

      /* COMMENT LEVEL SYSTEM */
      window.addReply = async (id) => {
        let txt = document.getElementById("r" + id).value.trim();
        let fileInput = document.getElementById("rf" + id);
        let isSpoiler = document.getElementById("rfs" + id).checked;

        if (!txt && fileInput.files.length === 0) return;
        let imagesData = await processMultipleFiles(fileInput, isSpoiler);
        let n = notes.find((note) => note.id === id);
        if (!n) return;

        n.replies.push({
          text: txt,
          images: imagesData,
          time: getFormattedDate(),
          subReplies: [],
          writerReply: "",
          writerTime: "",
          writerImages: [],
        });

        await updateDoc(doc(db, "notes", id), { replies: n.replies });
      };

      /* NESTED SUB-REPLY LAYER FOR COMMENTS */
      window.addSubReply = async (noteId, replyIndex) => {
        const idKey = `${noteId}-${replyIndex}`;
        let txt = document.getElementById(`sub-input-${idKey}`).value.trim();
        let fileInput = document.getElementById(`sub-file-${idKey}`);
        let isSpoiler = document.getElementById(`sub-spoil-${idKey}`).checked;

        if (!txt && fileInput.files.length === 0) return;
        let imagesData = await processMultipleFiles(fileInput, isSpoiler);
        let n = notes.find((note) => note.id === noteId);
        if (!n) return;

        if (!n.replies[replyIndex].subReplies) {
          n.replies[replyIndex].subReplies = [];
        }

        n.replies[replyIndex].subReplies.push({
          text: txt,
          images: imagesData,
          time: getFormattedDate(),
        });

        await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
      };

      /* DELETE SUB-REPLY */
      window.deleteSubReply = async (noteId, replyIndex, subIndex) => {
        let n = notes.find((note) => note.id === noteId);
        if (!n || !n.replies[replyIndex] || !n.replies[replyIndex].subReplies) return;

        n.replies[replyIndex].subReplies.splice(subIndex, 1);
        await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
      };

      /* WRITER MANAGEMENT FOR COMMENTS */
      window.addWriterReply = async (noteId, replyIndex) => {
        let n = notes.find((note) => note.id === noteId);
        if (!n) return;

        let txt = document
          .getElementById(`w-input-${noteId}-${replyIndex}`)
          .value.trim();
        let fileInput = document.getElementById(
          `w-file-${noteId}-${replyIndex}`
        );
        let spoilerInput = document.getElementById(
          `w-spoiler-${noteId}-${replyIndex}`
        );

        if (!txt && (!fileInput || fileInput.files.length === 0)) return;

        let imagesData = [];
        if (fileInput && fileInput.files.length > 0) {
          imagesData = await processMultipleFiles(
            fileInput,
            spoilerInput ? spoilerInput.checked : false
          );
        }

        n.replies[replyIndex].writerReply = txt;
        n.replies[replyIndex].writerTime = getFormattedDate();
        n.replies[replyIndex].writerImages = imagesData;

        await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
      };

      window.deleteWriterReply = async (noteId, replyIndex) => {
        let n = notes.find((note) => note.id === noteId);
        if (!n) return;
        n.replies[replyIndex].writerReply = "";
        n.replies[replyIndex].writerTime = "";
        n.replies[replyIndex].writerImages = [];
        await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
      };

      window.editReply = async (noteId, replyIndex) => {
        let n = notes.find((note) => note.id === noteId);
        if (!n) return;
        let updated = prompt("Edit reply:", n.replies[replyIndex].text);
        if (updated) {
          n.replies[replyIndex].text = updated;
          await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
        }
      };

      window.deleteReply = async (noteId, replyIndex) => {
        let n = notes.find((note) => note.id === noteId);
        if (!n) return;
        n.replies.splice(replyIndex, 1);
        await updateDoc(doc(db, "notes", noteId), { replies: n.replies });
      };

      /* BUILD WRITER INTERFACE SCREEN */
      function loadWriter() {
        let c = document.getElementById("writerNotes");
        let displayNotes = [...notes].sort(
          (a, b) => (b.timestamp || 0) - (a.timestamp || 0)
        );

        let htmlBuffer = displayNotes.map((n) => {
          let repliesMarkup = n.replies
            .map((r, ri) => {
              let subRepliesList = (r.subReplies || [])
                .map(
                  (sr, si) => `
              <div class="sub-reply-container">
                <span>${parseSpoilers(sr.text)}</span>
                ${renderImagesMarkup(sr.images)}
                <div class="time-container"><span class="time">${
                  sr.time
                }</span></div>
                <div class="button-group">
                  <button onclick="deleteSubReply('${n.id}', ${ri}, ${si})">Delete</button>
                </div>
              </div>`
                )
                .join("");

              let hasWriterContent =
                r.writerReply || (r.writerImages && r.writerImages.length > 0);
              let writerMarkup = hasWriterContent
                ? `<div class="writer-response">
                   <span>${parseSpoilers(r.writerReply)}</span>
                   ${renderImagesMarkup(r.writerImages)}
                   <div class="time-container"><span class="time">${
                     r.writerTime || n.time
                   }</span></div>
                   <div class="button-group">
                     <button onclick="deleteWriterReply('${
                       n.id
                     }', ${ri})">Delete Response</button>
                   </div>
                 </div>`
                : `<div style="margin-top:10px;">
                  <input id="w-input-${n.id}-${ri}" placeholder="Write response text..." onkeydown="if(event.key==='Enter') addWriterReply('${n.id}', ${ri})">
                  <div class="upload-panel">
                    <input type="file" id="w-file-${n.id}-${ri}" accept="image/*" multiple />
                    <label class="spoiler-toggle"><input type="checkbox" id="w-spoiler-${n.id}-${ri}" /> Spoiler Images?</label>
                  </div>
                  <div class="button-group"><button onclick="addWriterReply('${n.id}', ${ri})">Post Response</button></div>
                 </div>`;

              return `
              <div class="reply">
                <span>${parseSpoilers(r.text)}</span>
                ${renderImagesMarkup(r.images)}
                <div class="time-container"><span class="time">${
                  r.time
                }</span></div>
                ${subRepliesList}
                ${writerMarkup}
              </div>`;
            })
            .join("");

          return `
            <div class="note">
              <h3>${parseSpoilers(n.text)}</h3>
              ${renderImagesMarkup(n.images)}
              <div class="time-container"><span class="time">${
                n.time
              }</span></div>
              <div class="button-group" style="margin-top: 5px;">
                <button onclick="editNote('${n.id}',\`${
            n.text
          }\`)">Edit Note</button>
                <button onclick="deleteNote('${n.id}')">Delete Note</button>
              </div>
              ${repliesMarkup}
            </div>`;
        });

        c.innerHTML = htmlBuffer.join("");
      }

      /* BUILD VIEWER FEED SCREEN */
      function loadViewer() {
        let c = document.getElementById("viewerNotes");
        let displayNotes = [...notes].sort(
          (a, b) => (b.timestamp || 0) - (a.timestamp || 0)
        );

        let htmlBuffer = displayNotes.map((n) => {
          let repliesMarkup = n.replies
            .map((r, ri) => {
              const idKey = `${n.id}-${ri}`;
              let subRepliesList = (r.subReplies || [])
                .map(
                  (sr, si) => `
              <div class="sub-reply-container">
                <span>${parseSpoilers(sr.text)}</span>
                ${renderImagesMarkup(sr.images)}
                <div class="time-container"><span class="time">${
                  sr.time
                }</span></div>
                <div class="button-group">
                  <button onclick="deleteSubReply('${n.id}', ${ri}, ${si})">Delete</button>
                </div>
              </div>`
                )
                .join("");

              let writerMarkup =
                r.writerReply || (r.writerImages && r.writerImages.length > 0)
                  ? `<div class="writer-response">
                   <span>${parseSpoilers(r.writerReply)}</span>
                   ${renderImagesMarkup(r.writerImages)}
                   <div class="time-container"><span class="time">${
                     r.writerTime || n.time
                   }</span></div>
                 </div>`
                  : "";

              return `
              <div class="reply">
                <span>${parseSpoilers(r.text)}</span>
                ${renderImagesMarkup(r.images)}
                <div class="time-container"><span class="time">${
                  r.time
                }</span></div>
                <div class="button-group">
                  <button onclick="editReply('${n.id}',${ri})">Edit</button>
                  <button onclick="deleteReply('${n.id}',${ri})">Delete</button>
                </div>

                ${subRepliesList}
                ${writerMarkup}

                <div style="margin-left:20px; margin-top:10px;">
                  <input id="sub-input-${idKey}" placeholder="Reply to this comment..." style="padding:8px; font-size:13px; margin-top:5px;" onkeydown="if(event.key==='Enter') addSubReply('${n.id}', ${ri})">
                  <div class="upload-panel" style="padding:8px;">
                    <input type="file" id="sub-file-${idKey}" accept="image/*" multiple style="font-size:11px;">
                    <label class="spoiler-toggle" style="font-size:11px;">
                      <input type="checkbox" id="sub-spoil-${idKey}"> Spoiler Images?
                    </label>
                  </div>
                  <button onclick="addSubReply('${n.id}', ${ri})">Reply</button>
                </div>
              </div>`;
            })
            .join("");

          return `
            <div class="note">
              <h3>${parseSpoilers(n.text)}</h3>
              ${renderImagesMarkup(n.images)}
              <div class="time-container"><span class="time">${
                n.time
              }</span></div>

              <input id="r${n.id}" placeholder="Leave a thought..." onkeydown="if(event.key==='Enter') addReply('${n.id}')">
              <div class="upload-panel">
                <input type="file" id="rf${n.id}" accept="image/*" multiple />
                <label class="spoiler-toggle"><input type="checkbox" id="rfs${
                  n.id
                }" /> Spoiler Images?</label>
              </div>
              <div class="button-group"><button onclick="addReply('${
                n.id
              }')">Comment</button></div>

              ${repliesMarkup}
            </div>`;
        });

        c.innerHTML = htmlBuffer.join("");
      }
    </script>
  </body>
</html>
